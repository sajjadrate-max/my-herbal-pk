name: Build My Herbal PK APK

# APK بنا کر سائٹ کے ساتھ ہی MyHerbalPK.apk کے نام سے رکھتا ہے،
# تاکہ ڈاؤن لوڈ سیدھا myherbalpk.com سے ہو (GitHub کے redirect کے بغیر)
on:
  push:
    branches: [main]
    paths:
      - 'android-herbal/**'
      - '.github/workflows/herbal-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: herbal-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HERBAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/herbal-release.jks"
            echo "HERBAL_KEYSTORE_PATH=$RUNNER_TEMP/herbal-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::HERBAL_KEYSTORE_BASE64 secret not set; signing with a debug key"
          fi

      - name: Build release APK
        working-directory: android-herbal
        env:
          VERSION_CODE: ${{ github.run_number }}0
          HERBAL_KEYSTORE_PASSWORD: ${{ secrets.HERBAL_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MyHerbalPK.apk

      - name: Commit APK to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MyHerbalPK.apk
          git commit -m "Update MyHerbalPK.apk (build ${{ github.run_number }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
