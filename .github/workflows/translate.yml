name: Translate site into all languages

# ہر زبان کے الگ صفحات (/en/ /ar/ ...) بناتا ہے — tools/translate.mjs
# ضرورت: ریپو کے Secrets میں OPENAI_API_KEY
on:
  workflow_dispatch:
    inputs:
      langs:
        description: 'زبانیں (مثلاً en,ar,hi) — خالی چھوڑیں تو سب'
        required: false
        default: ''
      model:
        description: 'OpenAI ماڈل'
        required: false
        default: 'gpt-4o-mini'

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Translate in batches of 10 languages (saved after each batch)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ github.event.inputs.model }}
          INPUT_LANGS: ${{ github.event.inputs.langs }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::OPENAI_API_KEY secret is not set"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$INPUT_LANGS" ]; then ALL="$INPUT_LANGS"; else
            ALL=$(node -e "const s=require('fs').readFileSync('lang.js','utf8');const a={'ar-ae':1,'ar-sa':1,'ar-bh':1,'ar-qa':1,'ar-kw':1};console.log([...s.matchAll(/code: '([^']+)'/g)].map(m=>m[1]).filter(c=>c!=='ur'&&!a[c]).join(','))")
          fi
          IFS=',' read -ra L <<< "$ALL"
          failed=0
          for ((i=0; i<${#L[@]}; i+=10)); do
            BATCH=$(IFS=,; echo "${L[*]:i:10}")
            echo "=== $BATCH"
            LANGS="$BATCH" node tools/translate.mjs || failed=1
            git add -A
            git commit -qm "Translations: $BATCH" || true
            git pull -q --rebase origin main && git push -q origin HEAD:main || { sleep 5; git pull -q --rebase origin main && git push -q origin HEAD:main; }
          done
          exit $failed
